# Infra pipeline: fmt/validate on every change, plan against LocalStack on PRs so it needs no cloud credentials.
name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: ["4566:4566"]
        env: { SERVICES: "ec2,iam,s3,sts" }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint
      - name: Plan against LocalStack
        run: terraform plan -input=false -var use_localstack=true -out=tfplan
      - name: Apply + destroy against LocalStack (proves the graph builds end to end)
        run: |
          terraform apply -input=false -auto-approve tfplan
          terraform output
          terraform destroy -input=false -auto-approve -var use_localstack=true
