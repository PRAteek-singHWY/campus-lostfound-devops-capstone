# Infra pipeline: fmt, validate and tflint on every change; plan/apply of the network+S3 subset
# against LocalStack on PRs (EKS itself needs a real account and is applied from a workstation).
name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: ["4566:4566"]
        env: { SERVICES: "ec2,iam,s3,sts" }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint
      - name: Plan + apply network and S3 subset against LocalStack
        run: |
          terraform plan -input=false -var use_localstack=true -var enable_eks=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          terraform output
          terraform destroy -input=false -auto-approve -var use_localstack=true -var enable_eks=false
