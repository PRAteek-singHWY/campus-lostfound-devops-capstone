environment: prod
backend:
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 50 }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
frontend:
  replicaCount: 3
postgres:
  existingSecret: lostfound-db-credentials   # created out of band, never in Git
  storage: { size: 20Gi, storageClassName: gp3 }
ingress:
  host: lostfound.example.edu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: lostfound-tls
      hosts: [lostfound.example.edu]
podDisruptionBudget:
  enabled: true
