apiVersion: v1
kind: Service
metadata:
  name: {{ include "lostfound.fullname" . }}-db
  labels: {{- include "lostfound.labels" . | nindent 4 }}
spec:
  clusterIP: None            # headless: stable DNS for the StatefulSet pod
  selector: {{- include "lostfound.selector" (dict "ctx" . "tier" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lostfound.fullname" . }}-db
  labels: {{- include "lostfound.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lostfound.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels: {{- include "lostfound.selector" (dict "ctx" . "tier" "db") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lostfound.selector" (dict "ctx" . "tier" "db") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "lostfound.dbSecretName" . }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
  {{- end }}
