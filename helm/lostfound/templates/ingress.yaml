{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lostfound.fullname" . }}
  labels: {{- include "lostfound.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API straight to the backend Service; everything else to nginx/React
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "lostfound.fullname" . }}-backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lostfound.fullname" . }}-frontend
                port: { number: 80 }
{{- end }}
