server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's own readiness endpoint: no upstream involved
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # React app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # API calls go to the backend, resolved by name (Docker network or Kubernetes Service).
    # BACKEND_HOST / BACKEND_PORT are substituted at container start (nginx envsubst templates).
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
    }
}
